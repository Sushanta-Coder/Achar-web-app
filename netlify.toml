[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

# SPA fallback — all routes are handled by React Router on the client.
[[redirects]]
  from   = "/api/*"
  to     = "https://api.acharghar.com.np/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy sitemap and robots to the API so crawlers see live data.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "https://api.acharghar.com.np/sitemap.xml"
  status = 200
  force  = true

[[redirects]]
  from   = "/robots.txt"
  to     = "https://api.acharghar.com.np/robots.txt"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
